name: Test Report

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  phel-report:
    name: Phel Test Report
    runs-on: ubuntu-latest
    steps:
      - name: Publish Phel test report
        uses: dorny/test-reporter@v3
        with:
          artifact: /phel-test-results-php-(.*)/
          name: Phel Tests (PHP $1)
          path: '*.xml'
          reporter: java-junit
